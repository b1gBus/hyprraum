---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: hyprraum
base-image: ghcr.io/ublue-os/base-main
image-version: 44
description: This is my opinionated OS image based on Hyprland

modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
        - lihaohong/yazi
        - lionheartp/Hyprland
      cleanup: true
    install:
      install-weak-deps: false
      skip-unavailable: true
      packages:
        #config
        - stow

        # WM / session
        - hyprland
        - waybar
        - xdg-desktop-portal-hyprland
        - hyprpaper
        - hyprlock
        - hypridle
        - hyprland-guiutils
        - papirus-icon-theme
        # environment
        - qt5-qtwayland
        - qt6-qtwayland
        - wl-clipboard
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - xorg-x11-server-Xwayland
        - waybar
        - fuzzel
        - foot
        - sddm
        - qt6-qt5compat-devel
        - gtklock
        - polkit
        - hyprpolkitagent
        - dunst
        - wl-clipboard
        - gnome-keyring

        # screenshot
        - slurp
        - grim
        - swappy

        # File management
        - thunar
        - thunar-archive-plugin
        - thunar-volman
        - file-roller
        - imv

        # CLI essentials
        - tmux
        - zsh
        - starship
        - neovim
        - yazi
        - git
        - curl
        - wget
        - ripgrep
        - fd-find
        - bat
        - fzf
        - eza
        - acpi
        - mpv

        # Useful desktop helpers
        - pavucontrol
        - mpv-mpris
        - brightnessctl
        - playerctl
        - network-manager-applet
        - blueman-applet
        - xdg-user-dirs

        # Printing
        - cups        

        # Multimedia
        - v4l-utils-devel-tools 

        # Emoji font
        - twitter-twemoji-fonts 

    remove:
      packages:
        - firefox
        - firefox-langpacks
        - nano

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - io.gitlab.librewolf-community
          - org.mozilla.Thunderbird
          - org.onlyoffice.desktopeditors
          - org.localsend.localsend_app
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: brew
    nofile-limits: true
    brew-analytics: false
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Inter
  - type: script
    scripts:
      - "install-bibata-modern-ice.sh"
  - type: files
    files:
    - source: system/usr  # copies `files/system/*` (* means everything inside it) into your image's root folder `/`
      destination: /usr
    - source: system/etc  # copies `files/system/*` (* means everything inside it) into your image's root folder `/`
      destination: /etc
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
