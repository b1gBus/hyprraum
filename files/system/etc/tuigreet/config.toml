[display]
show_time = true
greeting = "Witaj! Servus! Hello! Salut!"
align_greeting = "center"
issue = false

[[outputs]]
connector = "eDP-1"
primary = true

[[outputs]]
connector = "DP-3"
enaled = false

[[outputs]]
connector = "DP-4"
enaled = false

[[outputs]]
connector = "DP-5"
enaled = false

[[outputs]]
connector = "DP-6"
enaled = false

[layout]
width = 60
window_padding = 2
container_padding = 1
prompt_padding = 1

[layout.widgets]
time_position = "top"      # "top", "bottom", "default", "hidden"
status_position = "bottom" # "top", "bottom", "default", "hidden"

[remember]
username = true
session = false
user_session = true

[user_menu]
enabled = true
min_uid = 1000
max_uid = 60000

[secret]
mode = "characters"  # "hidden" or "characters"
characters = "*"

[keybindings]
command = 2   # F2
sessions = 3  # F3
power = 12    # F12

[session]
sessions_dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]
xsessions_dirs = []
environments = []

[power]
use_setsid = false

[theme]
border = "white"
text = "green"
time = "blue"
container = "black"
title = "cyan"
greet = "yellow"
prompt = "magenta"
input = "white"
action = "bright-blue"
button = "bright-red"
